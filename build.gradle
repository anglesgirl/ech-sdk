// ECH + H3 Android SDK
//
// 版本与 CO3 严格对齐，避免接入方与 SDK 之间出现版本漂移：
//   Kotlin 2.1.20 / compileSdk 36(库用 35，见 ech/build.gradle) / minSdk 24 / AGP 8.7.3
plugins {
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
}

ext {
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    kotlinVersion = '2.1.20'
    okhttpVersion = '5.5.0'
    conscryptVersion = '2.7.0'
}
